help_menu:
  - group: "Profiles"
  - title: "FASRC"
    profile: "fasrc"
    icon: "/public/fasrc_logo.jpg"
  - title: "Sid"
    profile: "sid"
    icon: "/public/sid_logo.png"

profiles:
  fasrc:
    show_all_apps_link: false
    navbar_type: dark
    # dashboard_title property does not work yet
    # It requires a new change to the OnDemand Puppet Module. PR raised. 
    dashboard_title: FASRC
    dashboard_header_img_logo: "/public/fasrc_logo.png"
    brand_bg_color: "rgb(157,47,60)"
    brand_link_active_bg_color: "rgb(59, 61, 63)"
    
    disable_dashboard_welcome_message: true
    disable_dashboard_logo: true

    pinned_apps_group_by: "category"
    pinned_apps:
      - sys/Jupyter
      - sys/Matlab
      - sys/RStudioServer
      - sys/RemoteDesktop
      - sys/SAS
      - sys/Stata

    nav_categories: ["Clusters", "Files", "Jobs", "Interactive Apps" ]

    dashboard_layout:
      rows:
        - columns:
            - width: 10
              widgets:
                - "pinned_apps"
                - "motd"